spring.application.name=relate-test
spring.datasource.url=jdbc:postgresql://localhost:5433/lola_relate
spring.datasource.username=lola
spring.datasource.password=lola
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

lola.relate.traefik.dynamic-dir=target/test-traefik/dynamic
lola.relate.domain-suffix=db.lola-cloud.dev
lola.runway.api.base-url=http://localhost:8083
lola.lci.auth.introspect-url=http://localhost:8080/internal/v1/auth/introspect
lola.security.jwt.secret=lola-cloud-platform-secret-encryption-key-for-jwt-signing-256-bits-minimum

lola.relate.docker.enabled=false
lola.relate.docker.strict=false

lola.relate.s3.endpoint=http://127.0.0.1:9000
lola.relate.s3.region=us-east-1
lola.relate.s3.access-key=lola_admin
lola.relate.s3.secret-key=lola_admin_secret
lola.relate.s3.bucket-name=lola-relate-backups
lola.relate.store.api-url=http://localhost:8086
